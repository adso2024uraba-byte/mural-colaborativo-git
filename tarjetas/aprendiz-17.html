<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mi tarjeta</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100%;
            height: 190px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: transparent;
            font-family: Arial, sans-serif;
        }

        .figura {
            width: 150px;
            height: 150px;

            border-radius: 50%;
            background-color: #827717;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            font-size: 16px;
            font-weight: bold;
            text-align: center;

            padding: 12px;
        }
    </style>

</head>
<body>
    <div class="figura">
        SAMUEL DIAZ OLIVARES
    </div>
</body>
</html>
